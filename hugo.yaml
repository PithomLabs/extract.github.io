baseURL: https://ekstract.tech/
languageCode: en-us
title: Pithom Labs Scraper

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: Support
      pageRef: /support
      weight: 20      
    - name: Docs
      pageRef: /docs
      weight: 30
    - name: Search
      pageRef: /search
      weight: 40
      params:
        type: search

params:
  # Search
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      
      # full | forward | reverse | strict 
      tokenize: full      
      
  theme:
    # light | dark | system
    default: dark
    displayToggle: true      
    
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: full  
    
  navbar:
    displayTitle: true
    displayBreadcrumbs: true
    logo:
      path: logo.png
      dark: logo.png
      width: 32
      height: 32    
    
  footer:
    displayCopyright: true
    displayPoweredBy: false
    
  cdn:
    enabled: true
    # url: "https://izaakmaine-assets.t3.storage.dev"        
    url: "https://extract.t3.tigrisfiles.io/"        
    
services:
  googleAnalytics:
    ID: G-4X4ZM5ZRJ4

markup:
  goldmark:
    renderer:
      unsafe: true
